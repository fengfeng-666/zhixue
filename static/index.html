<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知学 · 智能学习助手</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header><div class="brand">知学 <span>· 智能学习助手</span></div><button id="logout" class="quiet hidden">退出登录</button></header>
<main><section id="auth" class="auth card"><div class="eyebrow">YOUR LEARNING COMPANION</div><h1>让每一次学习<br>更有方向。</h1><p>汇聚课程资料、提问与练习，开启属于你的学习空间。</p><label>用户名<input id="username" placeholder="至少 3 个字符"></label><label>密码<input id="password" type="password" placeholder="至少 8 个字符"></label><div class="row"><button id="login">登录</button><button id="register" class="secondary">注册</button></div><p id="authError" class="error"></p></section>
<section id="workspace" class="hidden"><aside><div class="sidebar-title"><strong>我的课程</strong><button id="addCourse" class="icon">＋</button></div><div id="courses"></div><div class="divider"></div><label>学习偏好<textarea id="preference" placeholder="例如：讲解时多举例"></textarea></label><button id="savePreference" class="secondary small">保存偏好</button></aside><div class="content"><div id="empty" class="empty"><div class="empty-icon">✳</div><h2>开始你的学习旅程</h2><p>创建一门课程，上传资料后即可提问、复习与练习。</p><button id="firstCourse">创建课程</button></div><div id="courseView" class="hidden"><div class="course-heading"><div><div class="eyebrow">LEARNING SPACE</div><h1 id="courseName"></h1></div><button id="newChat" class="secondary">＋ 新会话</button></div><div class="tabs"><button class="tab active" data-tab="chat">学习助手</button><button class="tab" data-tab="docs">课程资料</button><button class="tab" data-tab="mistakes">错题本</button></div><div id="chat" class="panel"><div class="chat-layout"><div><div class="chat-top"><span>对话记录</span><select id="conversations"><option value="">新会话</option></select></div><div id="messages" class="messages"><div class="welcome"><h2>今天想学些什么？</h2><p>上传课程资料后，试着向我提出一个问题。</p></div></div><div class="composer"><select id="mode"><option value="qa">课程问答</option><option value="explain">知识讲解</option><option value="review">错题复盘</option><option value="plan">学习规划</option><option value="quiz">生成测验</option></select><textarea id="question" placeholder="输入问题，或描述你的学习目标…"></textarea><button id="send">发送 ↑</button></div></div></div></div><div id="docs" class="panel hidden"><div class="section-head"><div><h2>课程资料</h2><p>上传资料，构建专属课程知识库。</p></div><label class="upload button">上传资料<input id="file" type="file" accept=".txt,.md,.pdf,.docx,.pptx,.png,.jpg,.jpeg,.webp" hidden></label></div><div id="documents"></div></div><div id="mistakes" class="panel hidden"><div class="section-head"><div><h2>错题本</h2><p>记录易错内容，再通过错题复盘加深理解。</p></div></div><textarea id="mistakeQuestion" placeholder="输入错题题目"></textarea><textarea id="mistakeAnswer" placeholder="你的答案或错误原因（选填）"></textarea><button id="addMistake">保存错题</button><div id="mistakeList"></div></div></div></div></section></main><div id="toast" class="toast hidden"></div><script src="/static/app.js"></script></body></html>
