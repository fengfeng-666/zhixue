services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: zhixue
      POSTGRES_USER: zhixue
      POSTGRES_PASSWORD: zhixue
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhixue -d zhixue"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:16379:6379"]
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://zhixue:zhixue@db:5432/zhixue
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
volumes:
  postgres_data:
